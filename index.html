<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Hasso</title>
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <div class="container">
            <img src="images/photo.webp" width="600" height="634" alt="Photo" class="profile-photo">
            <div class="buttons" id="nav-buttons">
                <a href="https://linkedin.com/in/michael-hasso" class="button linkedin">
                    <span class="icon"></span>
                    <span class="label">LinkedIn</span>
                </a>
                <a href="https://github.com/neuroborus" class="button github">
                    <span class="icon"></span>
                    <span class="label">GitHub</span>
                </a>
                <a href="https://cv.hasso.tech" class="button resume">
                    <span class="icon"></span>
                    <span class="label">Resume</span>
                </a>
            </div>
        </div>
    </div>
    <script>
        const container = document.querySelector("#nav-buttons");
        const buttons = Array.from(container.querySelectorAll(".button"));
        let selectedIndex = -1;
        let hoveredIndex = null;

        const setActiveIndex = (index) => {
            buttons.forEach((button, idx) => {
                button.classList.toggle("is-active", idx === index);
            });
        };

        container.addEventListener("pointermove", (event) => {
            const hoveredButton = event.target.closest(".button");
            if (!hoveredButton) {
                return;
            }

            const index = buttons.indexOf(hoveredButton);
            if (index === -1) {
                return;
            }

            if (index === hoveredIndex) {
                return;
            }

            hoveredIndex = index;
            selectedIndex = -1;
            setActiveIndex(hoveredIndex);
        });

        container.addEventListener("pointerleave", () => {
            hoveredIndex = null;
            if (selectedIndex >= 0) {
                setActiveIndex(selectedIndex);
            } else {
                setActiveIndex(-1);
            }
        });

        buttons.forEach((button, index) => {
            button.addEventListener("focusin", () => {
                if (hoveredIndex === null) {
                    selectedIndex = index;
                    setActiveIndex(selectedIndex);
                }
            });
        });

        document.addEventListener("keydown", (event) => {
            if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
                return;
            }

            const activeIndex = selectedIndex >= 0 ? selectedIndex : buttons.indexOf(document.activeElement);
            if (activeIndex === -1) {
                selectedIndex = 0;
                buttons[0]?.focus();
                setActiveIndex(selectedIndex);
                return;
            }

            event.preventDefault();
            const direction = event.key === "ArrowUp" || event.key === "ArrowLeft" ? -1 : 1;
            const nextIndex = (activeIndex + direction + buttons.length) % buttons.length;
            hoveredIndex = null;
            selectedIndex = nextIndex;
            buttons[nextIndex]?.focus();
            setActiveIndex(selectedIndex);
        });
    </script>
</body>
</html>
